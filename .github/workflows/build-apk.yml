name: Build Gabi APK

on:
  push:
    branches: [ main, voz-latencia ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 passou a falhar na imagem atual do
      # runner ubuntu-latest (step "Setup Android SDK", ~7s, sem log acessível
      # sem login mesmo em repo público — confirmado em 12/11/2026, run 11).
      # ubuntu-latest já vem com Android SDK pré-instalado (ANDROID_HOME/
      # ANDROID_SDK_ROOT definidos, platform-tools e API 34 presentes) —
      # o Gradle acha o SDK sozinho sem precisar dessa action.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compilar APK de debug
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: gabi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
